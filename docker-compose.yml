version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: trueauth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./backend
    container_name: trueauth-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      # Override the REDIS_URL from .env to point to the docker container hostname
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: trueauth-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  redis_data:
